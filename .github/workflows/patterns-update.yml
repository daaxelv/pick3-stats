name: Pattern Lab research checks
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'patterns/**'
      - 'jerseycash5/model.mjs'
      - 'jerseycash5/data.mjs'
      - '.github/workflows/patterns-update.yml'
permissions:
  contents: read
concurrency:
  group: patterns-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test patterns/*.test.mjs
      - run: |
          for file in patterns/*.mjs; do node --check "$file"; done
      - run: python -m unittest discover -s patterns -p 'test_*.py' -v
