name: Backfill NJ Quick Draw history

on:
  schedule:
    # 100 verified 500-draw ranges per run while the archive has gaps.
    - cron: '17 * * * *'
  pull_request:
    paths:
      - 'quickdraw/**'
      - '.github/workflows/quickdraw-backfill.yml'
  workflow_dispatch:
    inputs:
      batches:
        description: '500-draw batches to collect (1–200)'
        required: true
        default: '1'

permissions:
  contents: read

concurrency:
  group: quickdraw-backfill
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Collect one official batch and validate coverage
        run: |
          cp quickdraw/data/coverage.json /tmp/quickdraw-before.json
          node quickdraw/scripts/collect_official.mjs --max-batches 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('/tmp/quickdraw-before.json').read_text())
          coverage = json.loads(Path('quickdraw/data/coverage.json').read_text())
          assert coverage['loaded_draws'] > before['loaded_draws'], coverage
          assert coverage['first_draw'] == before['first_draw'], coverage
          assert coverage['last_draw'] >= before['last_draw'], coverage
          assert coverage['missing_draws_between_loaded_endpoints'] <= before['missing_draws_between_loaded_endpoints'], coverage
          PY

  backfill:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Collect next missing ranges
        id: collector
        continue-on-error: true
        run: node quickdraw/scripts/collect_official.mjs --max-batches '${{ github.event_name == 'schedule' && '100' || inputs.batches }}'
      - name: Save verified batches
        run: |
          git config user.name "quickdraw-results-bot"
          git config user.email "actions@github.com"
          git add quickdraw/data/
          if git diff --cached --quiet; then
            echo "No new batches."
          else
            git commit -m "Backfill NJ Quick Draw results $(date -u +%F)"
            # Another updater may advance main while this collector runs. Its
            # next scheduled run will resume at the remaining gap on new main.
            if ! git push origin HEAD:main; then
              git fetch origin main
              if git merge-base --is-ancestor HEAD^ origin/main; then
                echo "::warning::Main advanced during collection; skip stale batches. The next run will retry from current coverage."
              else
                echo "Push failed without a newer main; investigate permissions or network."
                exit 1
              fi
            fi
          fi
      - name: Report any collection failure
        if: steps.collector.outcome == 'failure'
        run: exit 1
