name: Backfill NJ Quick Draw history

on:
  pull_request:
    paths:
      - 'quickdraw/**'
      - '.github/workflows/quickdraw-backfill.yml'
  workflow_dispatch:
    inputs:
      batches:
        description: '500-draw batches to collect (1–200)'
        required: true
        default: '1'

permissions:
  contents: read

concurrency:
  group: quickdraw-backfill
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Collect one official batch and validate coverage
        run: |
          node quickdraw/scripts/collect_official.mjs --max-batches 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          coverage = json.loads(Path('quickdraw/data/coverage.json').read_text())
          assert coverage['loaded_draws'] == 2373, coverage
          assert coverage['gaps'][0]['from'] == 1001, coverage
          PY

  backfill:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Collect next missing ranges
        id: collector
        continue-on-error: true
        run: node quickdraw/scripts/collect_official.mjs --max-batches '${{ inputs.batches }}'
      - name: Save verified batches
        run: |
          git config user.name "quickdraw-results-bot"
          git config user.email "actions@github.com"
          git add quickdraw/data/
          if git diff --cached --quiet; then
            echo "No new batches."
          else
            git commit -m "Backfill NJ Quick Draw results $(date -u +%F)"
            git push
          fi
      - name: Report any collection failure
        if: steps.collector.outcome == 'failure'
        run: exit 1
